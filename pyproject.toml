[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-hub"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44,<47",
  "httpx>=0.28,<1",
  "mcp==1.27.2",
  "PyYAML>=6.0,<7",
  "packaging>=24,<27",
  "PyMySQL>=1.2,<2",
  "sqlglot>=30.14,<31",
  "websockets>=14,<17",
]

[project.optional-dependencies]
mobile = ["aiohttp>=3.13,<4"]
dev = [
  "aiohttp>=3.13,<4",
  "jsonschema>=4.23,<5",
  "openai>=1,<3",
  "Pillow==12.3.0",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
workflow-hub = "agent_workflow_hub.cli:entrypoint"

[tool.setuptools.package-data]
"agent_workflow_hub.xiaozhi_hermes_bridge" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = [
  "workflows/3d-printing/tests",
  "workflows/meeting-notes/tests",
  "workflows/daily-assistant/tests",
  "workflows/bead-pattern/tests",
  "workflows/information-collection/tests",
  "workflows/image-ocr/tests",
  "workflows/jenkins-operations/tests",
  "workflows/knowledge-support-agent/tests",
  "workflows/lan-file-sharing/tests",
  "workflows/requirements-analysis/tests",
  "workflows/test-reporting/tests",
  "workflows/mysql-operations/tests",
  "workflows/git-operations/tests",
  "workflows/specialized-agent-deployment/tests",
  "workflows/ssh-operations/tests",
  "workflows/desktop-client-automation/tests",
  "workflows/mobile-device-automation/tests",
  "workflows/agent-session-gateway/tests",
]
addopts = "-ra --import-mode=importlib"
